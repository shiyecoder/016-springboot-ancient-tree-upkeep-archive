<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>登录 · 古树名木养护档案管理系统</title><link rel="stylesheet" href="../mock.css">
<style>
body{margin:0;display:flex;min-height:100vh;background:#F3F8F8}
.vis{flex:1.15;background:linear-gradient(115deg,#0D2F3A 0%,#174A5C 45%,#2A7F86 100%);color:#fff;padding:64px 56px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.vis:after{content:"";position:absolute;right:-120px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.06)}
.vis .tagline{display:inline-block;align-self:flex-start;border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:5px 12px;font-size:12px;letter-spacing:2px;color:#DFF0F1}
.vis h1{font-size:34px;line-height:1.45;margin:22px 0 16px;font-weight:600}
.vis p{color:#C6DDE0;line-height:2;font-size:14px;margin:0}
.facts{display:flex;gap:36px;margin-top:44px}
.facts b{font-size:26px;display:block;font-variant-numeric:tabular-nums}.facts span{font-size:12px;color:#A9C9CD}
.panel{width:480px;background:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:center}
.panel .head{display:flex;gap:12px;align-items:center;margin-bottom:22px}
.panel .head i{width:40px;height:40px;border-radius:10px;background:#174A5C;color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:18px}
.panel .head b{font-size:20px;display:block}.panel .head span{font-size:12px;color:#5B6B70}
.field{margin-bottom:16px}.field label{display:block;font-size:13px;margin-bottom:6px;color:#33474C}
.field .inp{height:44px;width:100%;border:1px solid #DBE7E8;border-radius:6px;padding:0 12px;display:flex;align-items:center;color:#8EA3A7}
.submit{width:100%;height:44px;background:#174A5C;color:#fff;border:none;border-radius:6px;font-size:15px;letter-spacing:6px;cursor:pointer;margin-top:6px}
.roles{margin-top:22px;border-top:1px dashed #DBE7E8;padding-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:#5B6B70}
.roles span{border:1px solid #DBE7E8;border-radius:12px;padding:2px 10px;background:#F7FBFB}
</style></head><body>
<div class="vis">
  <span class="tagline">古树名木养护档案管理系统</span>
  <h1>一树一档<br>让每一株古树都有完整生命记录</h1>
  <p>档案 · 巡查 · 养护 · 评估 全流程留痕<br>分级巡查 / 紧急抢救 / 年度健康评估</p>
  <div class="facts"><div><b>22</b><span>在册古树</span></div><div><b>34</b><span>养护工单</span></div><div><b>38</b><span>年度评估</span></div></div>
</div>
<div class="panel">
  <div class="head"><i>古</i><div><b>登录系统</b><span>请使用单位分配的账号登录</span></div></div>
  <div class="field"><label>账号</label><div class="inp">请输入账号</div></div>
  <div class="field"><label>密码</label><div class="inp">请输入密码</div></div>
  <button class="submit" onclick="location.href='02-dashboard.html'">登 录</button>
  <div class="roles">演示账号：<span>管理员 admin</span><span>巡查人员 zhaomin</span><span>养护单位 lijing</span><span>园林专家 chenshu</span></div>
</div></body></html>
